<text class="s" x="947" y="1058" text-anchor="start" dominant-baseline="central">+5V</text>
<text class="th" x="40" y="1500" text-anchor="start" dominant-baseline="central">Notes</text>
<text class="s" x="40" y="1518" text-anchor="start" dominant-baseline="central">1. AD4691 VIO is 1.14 to 1.98 V (datasheet), so it cannot connect directly to the Pi 3.3 V GPIO. U5 translates 1.8 V (AD4691 side) to 3.3 V (Pi side). U7 makes the 1.8 V.</text>
<text class="s" x="40" y="1536" text-anchor="start" dominant-baseline="central">2. AD4691 AVDD is 5 V because REF (4.096 V) must not exceed AVDD by more than 0.25 V. LDO_IN is tied to AVDD, so the internal LDO makes the 1.8 V core on VDD. REF needs at least 1 µF.</text>
<text class="s" x="40" y="1554" text-anchor="start" dominant-baseline="central">3. MCP3208 VDD is 5 V because VDD must be at least VREF (4.096 V). Its logic is 5 V, so U6 translates 3.3 V (Pi side) to 5 V. U6 has its Pi pins on the S side and the MCP3208 on the D side.</text>
<text class="s" x="40" y="1572" text-anchor="start" dominant-baseline="central">4. GTL2003: SREF goes to the lower supply, GREF and DREF join and go to the higher supply through 200 kΩ with 100 nF. D-side lines need pull-ups (RN1, RN3). S-side pull-ups are not needed when VDD1 minus SREF is 1.5 V or more.</text>
<text class="s" x="40" y="1590" text-anchor="start" dominant-baseline="central">   U5 is exactly at that limit (3.3 V minus 1.8 V). If the 1.8 V side reads badly at speed, add 4.7 kΩ pull-ups from the S1 to S7 lines to +1V8.</text>
<text class="s" x="40" y="1608" text-anchor="start" dominant-baseline="central">5. SPI0 is shared: SCLK, MOSI and MISO go to both converters. CE0 selects the AD4691 and CE1 selects the MCP3208. Unselected devices release MISO, and both idle high.</text>
<text class="s" x="40" y="1626" text-anchor="start" dominant-baseline="central">6. AD4691 manual mode: CNV is tied to CS (close JP1), so each CS rising edge starts a conversion. Open JP1 to drive CNV from GPIO25 instead. RESET is on GPIO24 and GP0 on GPIO23.</text>
<text class="s" x="40" y="1644" text-anchor="start" dominant-baseline="central">   LED1 shows the state of GP0: GP0 (1.8 V) drives a BC847 (4.7 kΩ base, 100 kΩ pull-down), LED from +3V3 with 330 Ω (about 4 mA). GP0 must be set up as an output in the AD4691 registers. The Pi still sees GP0 on GPIO23.</text>
<text class="s" x="40" y="1662" text-anchor="start" dominant-baseline="central">7. Input RC (100 Ω and 1 nF) is a placeholder on every channel. Check it against each datasheet. NTC dividers and sensors tie their pull-ups to +VREF.</text>
<text class="s" x="40" y="1680" text-anchor="start" dominant-baseline="central">8. Pin tables: AD4691 and GTL2003 from the ADI and NXP datasheets. REF5040, TLV70018 and MCP3208 pin numbers are from memory: [CONFIRM] before routing.</text></svg></body></html>
