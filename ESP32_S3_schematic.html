<text class="s" x="60" y="1136" text-anchor="start" dominant-baseline="central">4 I/O2 (D+), 5 VBUS, 6 I/O1 (D-).</text>
<text class="s" x="60" y="1152" text-anchor="start" dominant-baseline="central">Pins 1 and 6 are one line (D-), pins 3 and 4 are one line (D+).</text>
<text class="s" x="60" y="1168" text-anchor="start" dominant-baseline="central">Both lines pass through the chip to the ESD diodes. [CONFIRM] in the datasheet.</text>

<text class="th" x="40" y="1495" text-anchor="start" dominant-baseline="central">Notes</text>
<text class="s" x="40" y="1513" text-anchor="start" dominant-baseline="central">Power: +5 V in, U2 makes +3V3 for the module and the board. 10 µF + 100 nF on both sides of U2, and on the module 3V3 pin.</text>
<text class="s" x="40" y="1531" text-anchor="start" dominant-baseline="central">EN: 10 kΩ to +3V3, 1 µF to GND, RESET button. IO0: BOOT button to GND (hold BOOT, press RESET to flash).</text>
<text class="s" x="40" y="1549" text-anchor="start" dominant-baseline="central">Analog inputs: divider, then 1 kΩ and 100 nF, then two BAT54 clamps at the pin (one to +2V5, one to GND). The pin stays between about -0.3 V and 2.8 V.</text>
<text class="s" x="40" y="1567" text-anchor="start" dominant-baseline="central">U4 makes the +2V5 clamp rail from +3V3. Keep the normal signal below about 2.5 V (ADC linear range). The 1 kΩ limits the clamp current if an input fails.</text>
<text class="s" x="40" y="1585" text-anchor="start" dominant-baseline="central">MainSupp (52 V battery) 100k/3.9k: 62 V gives 2.33 V, 58.4 V gives 2.19 V. 12V_Meas 56k/10k: 12 V gives 1.82 V, 14.4 V gives 2.18 V.</text>
<text class="s" x="40" y="1603" text-anchor="start" dominant-baseline="central">Batt_V (battery 48 to 52 V, 58.4 V when full) 100k/3.9k: 48 V gives 1.76 V, 52 V gives 1.90 V, 58.4 V gives 2.19 V.</text>
<text class="s" x="40" y="1621" text-anchor="start" dominant-baseline="central">5V_Meas 12k/10k: 5 V gives 2.27 V. 3.3V_Meas 4.7k/10k: 3.3 V gives 2.24 V. NTC1 and NTC2: 10 kΩ NTC to GND, 10 kΩ pull-up to +2V5. [CONFIRM] NTC value.</text>
<text class="s" x="40" y="1639" text-anchor="start" dominant-baseline="central">IO1, IO2, IO8, IO9, IO10 are ADC1. IO15 and IO16 are ADC2 (Wi-Fi must stay off). Module is the N16 (quad flash, no PSRAM): IO47 (pGood) and IO48 (status LED) are 3.3 V. IO35-IO37 carry PWM_CH5-CH7.</text>
<text class="s" x="40" y="1657" text-anchor="start" dominant-baseline="central">PWM_CH1 to PWM_CH8 go to the ULN2803A inputs, which have 10 kΩ pull-downs so the gates stay off while the pins float at reset.</text>
<text class="s" x="40" y="1675" text-anchor="start" dominant-baseline="central">USB: J5 on IO19 (D-) and IO20 (D+) flashes the module with no converter IC. Hold BOOT, press RESET, release BOOT. U3 is ESD protection, D1 ORs USB VBUS into +5V.</text>
<text class="s" x="40" y="1693" text-anchor="start" dominant-baseline="central">SPI: IO12/13/14/21 are routed through the GPIO matrix (SPI2 slave). Add 3.3 V level only, the Pi 5 is 3.3 V.</text>
<text class="s" x="40" y="1711" text-anchor="start" dominant-baseline="central">[CONFIRM] module pin numbers and all values against the ESP32-S3-WROOM-1 datasheet and your parts before routing.</text></svg></body></html>
