<text class="th" x="40" y="1830" text-anchor="start" dominant-baseline="central">Notes</text>
<text class="s" x="40" y="1848" text-anchor="start" dominant-baseline="central">Power: +5 V in, U2 makes +3V3 for the module and the board. 10 µF + 100 nF on both sides of U2, and on the module 3V3 pin.</text>
<text class="s" x="40" y="1866" text-anchor="start" dominant-baseline="central">EN: 10 kΩ to +3V3, 1 µF to GND, RESET button. IO0: BOOT button to GND (hold BOOT, press RESET to flash).</text>
<text class="s" x="40" y="1884" text-anchor="start" dominant-baseline="central">Analog inputs: divider, then 1 kΩ and 100 nF, then two BAT54 clamps at the pin (one to +2V5, one to GND). The pin stays between about -0.3 V and 2.8 V.</text>
<text class="s" x="40" y="1902" text-anchor="start" dominant-baseline="central">U4 (REF5025) makes the +2V5 rail from +3V3. The 1 kΩ bleed to GND lets the clamps sink current, because the reference can only source.</text>
<text class="s" x="40" y="1920" text-anchor="start" dominant-baseline="central">Keep the normal signal below about 2.5 V (ADC linear range). The 1 kΩ limits the clamp current if an input fails.</text>
<text class="s" x="40" y="1938" text-anchor="start" dominant-baseline="central">MainSupp (52 V battery) 100k/3.9k: 62 V gives 2.33 V, 58.4 V gives 2.19 V. 12V_Meas 56k/10k: 12 V gives 1.82 V, 14.4 V gives 2.18 V.</text>
<text class="s" x="40" y="1956" text-anchor="start" dominant-baseline="central">Batt_V (battery 48 to 52 V, 58.4 V when full) 100k/3.9k: 48 V gives 1.76 V, 52 V gives 1.90 V, 58.4 V gives 2.19 V.</text>
<text class="s" x="40" y="1974" text-anchor="start" dominant-baseline="central">5V_Meas 12k/10k: 5 V gives 2.27 V. 3.3V_Meas 4.7k/10k: 3.3 V gives 2.24 V. NTC1 (RT1, on the board) and NTC2 (sensor on header J7): 10 kΩ NTC to GND, 22 kΩ pull-up to +4V096 (U8). [CONFIRM] NTC value.</text>
<text class="s" x="40" y="1992" text-anchor="start" dominant-baseline="central">The 22 kΩ keeps the pin below 2.5 V down to about 0 °C (2.45 V). An open or unplugged sensor reads 4.1 V, and the BAT54 clamp holds the pin near 2.8 V.</text>
<text class="s" x="40" y="2010" text-anchor="start" dominant-baseline="central">All 7 analog inputs are on ADC1 (IO1, IO2, IO4, IO5, IO8, IO9, IO10), so they keep working with Wi-Fi on.</text>
<text class="s" x="40" y="2028" text-anchor="start" dominant-baseline="central">PWM_CH1/CH2 are on IO38/IO39. Ext_Trigg1/2 (outputs) are on IO17, IO18 (ADC2 pins used as digital I/O). Ext_Trigg3/4 were dropped.</text>
<text class="s" x="40" y="2046" text-anchor="start" dominant-baseline="central">IO15 and IO16 are the ADC chip selects on J15: pin 1 = AD4691 (IO15), pin 2 = MCP3208 (IO16), 100 Ω in series.</text>
<text class="s" x="40" y="2064" text-anchor="start" dominant-baseline="central">Buttons BTN1 to BTN4 are on the MCP23008 (U9) pins GP4 to GP7, to GND. Enable its internal pull-ups (GPPU). I2C address 0x20 (A0, A1, A2 to GND). INT (IO48) signals a button press. [CONFIRM] MCP23008 pin numbers.</text>
<text class="s" x="40" y="2082" text-anchor="start" dominant-baseline="central">U10 ULN2003A: IN1 and IN2 carry Ext_Trigg1/2 (open-collector outputs on J11), IN3 and the other inputs are grounded.</text>
<text class="s" x="40" y="2100" text-anchor="start" dominant-baseline="central">Add 10 kΩ pull-ups to +3V3 on the two chip-select lines (on the ADC board) so the ADCs stay deselected while the ESP32 boots. The ADC board SCK/MOSI/MISO still need a master.</text>
<text class="s" x="40" y="2118" text-anchor="start" dominant-baseline="central">COM goes to +12V for the flyback diodes. 10 kΩ pull-downs (RN4) keep the outputs off at reset; unused inputs are grounded.</text>
<text class="s" x="40" y="2136" text-anchor="start" dominant-baseline="central">A 3.3 V input is marginal for a ULN2003A at high current: fine for light loads. [CONFIRM] ULN2003A pin numbers. IO3, IO40, IO45 and IO46 are left free (IO3, IO45 and IO46 are strapping pins).</text>
<text class="s" x="40" y="2154" text-anchor="start" dominant-baseline="central">Module is the N16R2 (quad flash, quad PSRAM; [CONFIRM] in the ordering table): IO47 (pGood) and IO48 (MCP_INT) are 3.3 V. IO35-IO37 carry PWM_CH5-CH7.</text>
<text class="s" x="40" y="2172" text-anchor="start" dominant-baseline="central">PWM_CH1 to PWM_CH8 go to the ULN2803A inputs, which have 10 kΩ pull-downs so the gates stay off while the pins float at reset.</text>
<text class="s" x="40" y="2190" text-anchor="start" dominant-baseline="central">USB: J5 on IO19 (D-) and IO20 (D+) flashes the module with no converter IC. Hold BOOT, press RESET, release BOOT. U3 is ESD protection, D1 ORs USB VBUS into +5V.</text>
<text class="s" x="40" y="2208" text-anchor="start" dominant-baseline="central">SPI: IO12/13/14/21 are routed through the GPIO matrix (SPI2 slave). Add 3.3 V level only, the Pi 5 is 3.3 V.</text>
<text class="s" x="40" y="2226" text-anchor="start" dominant-baseline="central">[CONFIRM] module pin numbers and all values against the ESP32-S3-WROOM-1 datasheet and your parts before routing.</text></svg></body></html>
